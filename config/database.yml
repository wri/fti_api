default: &default
  adapter: postgis
  encoding: unicode
  # postgis extensions put tiger/topology on the database search_path, keep them out of schema.rb
  schema_search_path: public
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  # please see the update below about using hostnames to
  # access linked services via docker-compose
  host: <%= ENV['POSTGRES_HOST'] %>
  port: <%= ENV['POSTGRES_PORT'] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DATABASE") { "fti_development" } %>

test:
  <<: *default
  database: fti_test<%= ENV['TEST_ENV_NUMBER'] %>

e2e:
  <<: *default
  database: fti_e2e
  # Cypress drops and recreates this database between tests, which terminates
  # the server's pooled connections. ActiveRecord skips verification for any
  # connection used within verify_timeout (default 2s) and would hand out a dead
  # one, 500ing the first requests of the next test. Always verify instead.
  verify_timeout: 0

staging:
  <<: *default
  database: fti_api_staging

production:
  <<: *default
  database: fti_api_production
