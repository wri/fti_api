name: Tests
on: push

jobs:
  e2e-setup:
    name: Check E2E Setup
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ruby-env

      - name: Setup E2E database
        run: bin/rails e2e:setup RAILS_ENV=e2e

  tests:
    name: Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          RAILS_ENV: test
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ruby-env

      - name: Install other dependencies
        run: |
          npm install -g mjml@4

      - name: Setup test database
        run: bin/rake parallel:setup

      - name: Run tests
        run: bin/rake parallel:spec

      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capybara-failures
          path: tmp/capybara/
          if-no-files-found: ignore

      - name: Upload Code Coverage
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage/
